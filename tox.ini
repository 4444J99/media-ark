# tox configuration for the media-ark platform.
# Created 2026-06-09 (PR #10) to address the F9 premortem finding:
# `npm run release:verify` is local-only; the test suite had been
# exercised only on the developer's working tree.
#
# This tox.ini runs the same test suite against a 2-version matrix
# using the source-tree path (the project has no pyproject.toml /
# setup.py, so wheel-install paths are not applicable). The matrix
# is `py311, py314` because those are the two versions actually in
# use: py311 is what the GitHub Actions CI runs on (see
# .github/workflows/automation-ci.yml line 39), and py314 is the
# developer's local default. See docs/regression-findings.md §F9
# and §Source-tree notes for the full rationale.
#
# Usage:
#   pip install tox
#   tox              # runs py311 and py314
#   tox -e py311     # runs just one env
#   tox -e py314     # runs just the other
#
# Each env sets PYTHONPATH=src so the `from src.media_ark
# import ...` imports in the test file resolve against the source
# tree directly (the same way the developer runs `npm test`).
#
# Note: a future contribution that adds a pyproject.toml and makes
# this a packaged project should add a third env (e.g.,
# `py311-wheel`) that runs tests against an installed wheel rather
# than the source tree. That env is intentionally absent here
# because the project is not currently packaged.

[tox]
envlist = py311, py314
isolated_build = False
skip_missing_interpreters = True

[testenv]
setenv =
    PYTHONPATH = {toxinidir}/src
deps =
    pytest
commands =
    python -m unittest discover -s tests -p 'test_*.py' -v
