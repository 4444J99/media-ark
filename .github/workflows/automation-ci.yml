name: capture-automation-ci

# Runner-pickup status (2026-06-08, 22 confirmed failures today):
# this workflow's "CLI smoke" job has been failing consistently with
# runner_id: 0 / zero steps / ~3-second death across 22 runs on this
# repo. The failure is a GitHub-side hosted-runner handoff problem
# specific to this repo, NOT a code problem. Cross-account evidence
# (limen and a-i--skills on the same account, same day, same runner
# pool) shows the pool is healthy for other repos. An attempted fix
# that swapped ubuntu-latest -> ubuntu-22.04 (a different image
# label, different runner pool) failed the same way, falsifying the
# image-label theory. No self-hosted runners are registered on this
# account. The local release verifier (`npm run release:verify`) is
# the ground truth and is green on the merge commit; the failing
# GitHub Actions check is informational under the current
# branch-protection rules (no required status checks on main).
#
# Recommended next actions if a hard green check is needed in the
# future: (a) register a self-hosted runner for this repo and add a
# `runs-on: self-hosted` job that runs first with `continue-on-error:
# true`, falling through to the hosted runner if no self-hosted
# runner is registered; (b) move the capture-automation CI to a
# separate repository; (c) wait for the GitHub-side transient to
# clear. All three are out of scope for the current branch.

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify CLI entrypoint
        run: |
          python3 src/capture_automation/process_captures.py --help | head -n 5
          python3 src/capture_automation/process_captures.py /tmp --out /tmp/.capture-automation --dry-run --json-report --max-files 1 > /tmp/cli-smoke.json
          test -s /tmp/cli-smoke.json

      - name: Run release verifier
        run: |
          npm run release:verify
