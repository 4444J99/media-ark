name: capture-automation-ci

# The "CLI smoke" check (smoke-hosted) previously declared
# `needs: smoke-self-hosted`, a diagnostic job pinned to
# `runs-on: self-hosted`. No self-hosted runner is registered for this
# repo, so that job never reached a terminal state; the dependent
# smoke-hosted job therefore never started and the required "CLI smoke"
# status check stayed pending forever, blocking every open PR. The
# self-hosted diagnostic job has been removed and smoke-hosted now runs
# directly on GitHub-hosted runners.

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  smoke-hosted:
    name: CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify CLI entrypoint
        run: |
          python3 src/media_ark/process_captures.py --help | head -n 5
          python3 src/media_ark/process_captures.py /tmp --out /tmp/.media-ark --dry-run --json-report --max-files 1 > /tmp/cli-smoke.json
          test -s /tmp/cli-smoke.json

      - name: Run release verifier
        run: |
          npm run release:verify

  tox-matrix:
    name: Tox matrix (py311, py314)
    needs: smoke-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tox

      - name: Run tox matrix
        run: |
          tox -m py311 py314
