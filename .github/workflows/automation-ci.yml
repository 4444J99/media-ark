name: capture-automation-ci

# Runner-pickup: 27+ confirmed failures across 5 falsified experiments
# (hosted-runner 0-step 3s death; self-hosted queue-indefinite).
# Diagnosis keyword: "runner-pickup" (greppable in code-search bots that
# index .yml only). Full diagnosis anchors:
#   MERGE_PATH.md         §"Post-merge runner-pickup hardening"   (line ~164)
#   docs/SHIP_EVIDENCE.md §"Post-merge runner-pickup hardening"   (line ~92)
# Last on-this-SHA run: 27222319216 (2026-06-09 16:59:41 UTC, cancelled).

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  smoke-self-hosted:
    name: CLI smoke (self-hosted, optional)
    runs-on: self-hosted
    continue-on-error: true
    timeout-minutes: 2
    steps:
      - name: Echo self-hosted marker
        run: |
          echo "running on self-hosted runner"
          echo "RUNNER_NAME=${RUNNER_NAME:-unset}"

  smoke-hosted:
    name: CLI smoke
    needs: smoke-self-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify CLI entrypoint
        run: |
          python3 src/capture_automation/process_captures.py --help | head -n 5
          python3 src/capture_automation/process_captures.py /tmp --out /tmp/.capture-automation --dry-run --json-report --max-files 1 > /tmp/cli-smoke.json
          test -s /tmp/cli-smoke.json

      - name: Run release verifier
        run: |
          npm run release:verify

  tox-matrix:
    name: Tox matrix (py311, py314)
    needs: smoke-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tox

      - name: Run tox matrix
        run: |
          tox -m py311 py314
