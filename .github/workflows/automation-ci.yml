name: capture-automation-ci

# Runner-pickup: 27+ confirmed failures across 5 falsified experiments
# (hosted-runner 0-step 3s death; self-hosted queue-indefinite).
# Diagnosis keyword: "runner-pickup" (greppable in code-search bots that
# index .yml only). Full diagnosis anchors:
#   MERGE_PATH.md         §"Post-merge runner-pickup hardening"   (line ~164)
#   docs/SHIP_EVIDENCE.md §"Post-merge runner-pickup hardening"   (line ~92)
# Last on-this-SHA run: 27222319216 (2026-06-09 16:59:41 UTC, cancelled).

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  smoke-hosted:
    name: CLI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify CLI entrypoint
        run: |
          python3 src/media_ark/process_captures.py --help | head -n 5
          python3 src/media_ark/process_captures.py /tmp --out /tmp/.media-ark --dry-run --json-report --max-files 1 > /tmp/cli-smoke.json
          test -s /tmp/cli-smoke.json

      - name: Run release verifier
        run: |
          npm run release:verify

  tox-matrix:
    name: Tox matrix (py311, py314)
    needs: smoke-hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tox

      - name: Run tox matrix
        run: |
          tox -e py311,py314
