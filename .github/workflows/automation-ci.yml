name: capture-automation-ci

# Runner-pickup status (2026-06-08, 25+ confirmed failures today):
# this workflow's "CLI smoke" job has been failing consistently with
# runner_id: 0 / zero steps / ~3-second death across 25+ runs on this
# repo. The failure is a GitHub-side hosted-runner handoff problem
# specific to this repo, NOT a code problem. Cross-account evidence
# (limen and a-i--skills on the same account, same day, same runner
# pool) shows the pool is healthy for other repos. The image-label
# theory has been falsified (ubuntu-22.04 failed the same way). The
# local release verifier (`npm run release:verify`) is the ground
# truth and is green on the merge commit; the failing GitHub Actions
# check is informational under the current branch-protection rules
# (no required status checks on main).
#
# This branch experiments with a self-hosted-first / hosted-fallback
# pattern. The hypothesis: with `runs-on: self-hosted` first, jobs
# that cannot find a self-hosted runner will fail with a clear
# 'no matching runner' error rather than the silent 3-second
# pickup-death, and the hosted job will run as a fallback via
# `needs: ... if: always()`. If the hosted-fallback job produces
# a clean run on this repo, the runner-pickup issue is
# specifically a *first-choice hosted* handoff problem and routing
# around it breaks the broken path. If the hosted-fallback job
# also dies the same way, the issue is not first-choice-specific
# and a different remediation is needed.
#
# Recommended next actions if the hosted fallback also dies:
# (a) register a real self-hosted runner for this repo, or
# (b) move the capture-automation CI to a separate repository, or
# (c) wait for the GitHub-side transient to clear.

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  smoke-self-hosted:
    name: CLI smoke (self-hosted, optional)
    runs-on: self-hosted
    continue-on-error: true
    timeout-minutes: 2
    steps:
      - name: Echo self-hosted marker
        run: |
          echo "running on self-hosted runner"
          echo "RUNNER_NAME=${RUNNER_NAME:-unset}"

  smoke-hosted:
    name: CLI smoke
    needs: smoke-self-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify CLI entrypoint
        run: |
          python3 src/capture_automation/process_captures.py --help | head -n 5
          python3 src/capture_automation/process_captures.py /tmp --out /tmp/.capture-automation --dry-run --json-report --max-files 1 > /tmp/cli-smoke.json
          test -s /tmp/cli-smoke.json

      - name: Run release verifier
        run: |
          npm run release:verify
