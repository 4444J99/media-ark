# Deploy the media-ark API + dashboard to Cloud Run.
#
# SUPERSEDED (2026-07-01) -- this is the road not taken. It was cloned from
# organvm/limen's deploy-api.yml, which is itself a no-op (limen's live API is a
# Cloudflare Worker), so it inherited a GCP_SA_KEY requirement for a credential
# that exists NOWHERE. The deploy host was DERIVED to Cloudflare Containers
# instead, using a token already owned (see DEPLOY.md). This workflow is KEPT as
# a harmless no-op (still GATED on GCP_SA_KEY, which will never be set) only so
# the history stays honest; it does not deploy anything. Do NOT wire GCP_SA_KEY
# here unless the host decision is ever explicitly reversed back to GCP.
# The real deploy path lives in DEPLOY.md.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: device-streaming-067d747a
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: media-ark-api

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # allow-secret
    env:
      GCP_SA_KEY_SET: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Note skipped deploy
        if: env.GCP_SA_KEY_SET == 'false'
        run: echo "::notice::GCP_SA_KEY not configured; skipping Cloud Run deploy. media-ark stays undeployed until the creds organ lands GCP_SA_KEY on this repo."

      - uses: google-github-actions/auth@v3
        if: env.GCP_SA_KEY_SET == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        if: env.GCP_SA_KEY_SET == 'true'

      - name: Deploy Cloud Run service
        if: env.GCP_SA_KEY_SET == 'true'
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --allow-unauthenticated \
            --set-env-vars MEDIA_ARK_QUOTA_DB=/tmp/media-ark/quota.json,MEDIA_ARK_USERS_DB=/tmp/media-ark/users.db,MEDIA_ARK_USER_SANDBOX_ROOT=/tmp/media-ark/sandboxes

      - name: Print service URL
        if: env.GCP_SA_KEY_SET == 'true'
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)'
