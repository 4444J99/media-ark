# Parseable intent tables — see routing.md for the human-readable narrative
# This file is the data. routing.md is the story. Both must stay in sync.

[intent.verify]
description = "Run `npm run release:verify` and report ok/fail. No state change."
agents      = ["codex", "claude", "opencode"]
constraints = [
  "Read-only. Do not modify any file as part of the verify pass.",
  "Report the full `{\"ok\": true, ...}` shape; do not summarize.",
  "If `ok: false`, stop and report the failing gate name. Do not attempt remediation.",
]

[intent.triage]
description = "Open, comment on, or label issues. No code changes."
agents      = ["jules", "gpt-scheduled", "claude"]
constraints = [
  "Read-only on code, write-only on issue comments and labels.",
  "Do not close issues; the conductor decides close vs. not_planned.",
  "If an issue references a failing run, post the `gh run list` excerpt, not a paraphrase.",
]

[intent.commit]
description = "Create an atomic commit on a feature branch. No push."
agents      = ["codex", "claude", "opencode"]
constraints = [
  "One DONE per commit (see fleet-standing-rules.md #3).",
  "Conventional Commits subject (`feat:`, `fix:`, `docs:`, `chore:`, `refactor:`, `test:`).",
  "Branch name matches intent prefix (`feat/`, `fix/`, `docs/`, `chore/`, `ci/`, `evolve/`).",
  "Do not commit `package-lock.json` changes unless the commit's intent is dependency management.",
]

[intent.push]
description = "Push a feature branch to origin. No PR creation."
agents      = ["codex", "claude", "opencode"]
constraints = [
  "Branch must be a feature branch (not `main`, not a session branch the conductor has not authorized).",
  "Never `git push --force`. Never `git push --force-with-lease` without an explicit conductor auth line in the session narrative.",
  "Never push to `main` directly. Branch protection rejects it; an attempted push is a session-narrative red flag.",
]

[intent.pr-draft]
description = "Open a PR against `main` from a feature branch. Draft allowed."
agents      = ["codex", "claude"]
constraints = [
  "PR body must include: purpose, impacted paths, validation commands with outcomes, linked issue(s).",
  "Draft PRs are acceptable for incomplete work; the PR is the unit of review, not the commit.",
  "Do not bypass `required_conversation_resolution` with `--admin` until all review threads are resolved.",
  "Squash-merge only. Never `gh pr merge --merge` or `--rebase` (branch protection `required_linear_history: true`).",
]

[intent.pr-merge]
description = "Squash-merge a PR. Conductor-only."
agents      = []
constraints = [
  "No agent is authorized to merge. The 0.2.0 handoff's parity gap was caused by an agent attempting a direct push to `main`; the same logic forbids an agent from triggering the merge.",
  "When the conductor is ready to merge, the agent should hand the conductor a ready-to-paste `gh pr merge <N> --squash --delete-branch` command rather than executing it.",
]

[intent.worktree-new]
description = "Create a new worktree for a feature branch or peer worktree."
agents      = ["opencode"]
constraints = [
  "opencode is the only agent with the cross-host worktree peer convention (`~/Desktop/media-ark--<name>`) when the conductor explicitly requests it. The default is `~/Workspace/4444J99/media-ark--<name>`.",
  "Worktree name format: `media-ark--<pr-number-or-purpose>` (matches the 0.2.0 closeout's `media-ark--container-2026-06-10` and the new `media-ark--pr-17-fleet` patterns).",
  "Base branch is `origin/main` unless the conductor specifies otherwise.",
]

[intent.worktree-prune]
description = "Remove a worktree and delete its branch. Conductor-only."
agents      = []
constraints = [
  "No agent may `git worktree remove` or `git branch -D` without explicit conductor authorization in the session narrative. See fleet-standing-rules.md #5.",
  "When the worktree's branch is fully merged to `main` and untouched for 14+ days, an agent may *propose* the prune (with the branch name, last-touch date, and `git log origin/main..origin/<branch>` evidence) but may not execute.",
]

[intent.handoff-write]
description = "Author or amend a file in `docs/handoff/`. Doc-only change."
agents      = ["claude", "codex"]
constraints = [
  "File naming: `docs/handoff/<project>-<version>-<YYYY-MM-DD>.md` (e.g. `media-ark-0.2.0-2026-06-10.md`).",
  "File discipline matches `docs/regression-findings.md`: lean facts, dense context, named blind spots.",
  "Doc-only PR. No code paths touched. PR title: `docs: <purpose>`.",
  "The 0.2.0 handoff's parity gap (handoff on disk but untracked because direct-push to `main` was rejected) is the canonical failure mode this intent prevents recurrence of.",
]

[intent.fleet-handoff-author]
description = "Author or amend files in `conductor/`. Forward-looking proposal, not 0.2.0 closeout work."
agents      = ["claude", "codex"]
constraints = [
  "The 0.2.0 closeout is closed. `conductor/` changes are *new lane* work, not closeout continuation.",
  "PR title: `feat: <purpose>` (Conventional Commits `feat:` for new surfaces, not `docs:`).",
  "Any change to `secrets-map.md` is a conductor-only decision; the agent may author the skeleton but may not fill the cells.",
  "Cross-references in `conductor/README.md` and `fleet-standing-rules.md` must stay in sync with the actual file paths.",
  "The `routing.md` (narrative) and `routing.tables.toml` (data) split is a PR #18 convention; both must be updated together when intents change.",
]


[intent.branch-protect-edit]
description = "Modify `main` branch protection via the GitHub API. Conductor-only."
agents      = []
constraints = [
  "No agent may call `gh api .../branches/main/protection` (PUT, PATCH, or DELETE). The `MERGE_PATH.md` §\"What actually blocks the PR merge\" diagnosis workflow is the precedent: branch protection changes are a human decision, full stop.",
  "When the issue #5 close-criterion is met (self-hosted-runner registration or `not_planned`), the re-enable command in `docs/repo-audit.md` Gap #1 is the canonical recipe. The agent may post the recipe as a PR comment; the agent may not execute it.",
  "Branch protection changes are paired with `release-publish`: a release in flight is the trigger to re-enable required status checks. The pairing is named, not enforced by automation.",
]

[intent.release-publish]
description = "Bump the version in `pyproject.toml` and `package.json`, update `CHANGELOG.md` to a dated release section, and tag. Conductor-only."
agents      = []
constraints = [
  "No agent may bump `version` in `pyproject.toml` or `package.json`. The 0.2.0 closeout shipped the version bump in PR #13 (squash-merge `ebd9bc5`) as part of the rename-evolve; the next bump is a conductor call.",
  "The version bump must be paired with a `CHANGELOG.md` `[Unreleased]` → `[X.Y.Z] — YYYY-MM-DD` rename. The CHANGELOG follows [Keep a Changelog](https://keepachangelog.com/); the agent may *draft* the renamed section, the conductor commits and tags.",
  "Tagging: `git tag -a vX.Y.Z -m 'Release X.Y.Z'` followed by `git push origin vX.Y.Z`. The tag is a release artifact, not a session artifact; the conductor tags.",
  "Paired with `branch-protect-edit`: once a tag is pushed, re-enable required status checks on `main` (when Actions billing recovers per issue #5).",
]

[intent.npm-publish]
description = "Publish `media-ark` to npm. Conductor-only, requires the npm token (not yet in `secrets-map.md`)."
agents      = []
constraints = [
  "No agent may run `npm publish`. The npm token is not yet in `secrets-map.md`; per the secrets-map cell-value semantics, `unset` is implicit `none`, so no agent has token access.",
  "Pre-publish checklist (the agent may draft, the conductor executes): (1) `version` in `package.json` matches the `release-publish` intent, (2) `npm pack` produces a tarball whose contents match the repo's `pyproject.toml` files, (3) `npm run release:verify` is green on the release commit, (4) the release commit has a tag from the `release-publish` intent.",
  "The `BRAND_NPM` constant in `src/media_ark/__init__.py` is the package name. Renaming the package is a brand-module change (PR #13's discipline).",
]

[intent.worktree-peer-Desktop]
description = "Retired. The `~/Desktop/media-ark--*` worktree-peer convention is no longer canonical. Use `~/Workspace/4444J99/media-ark--*` instead."
agents      = []
constraints = [
  "The `~/Desktop/` peer convention (the 0.2.0 closeout's `media-ark--container-2026-06-10`) is retired as of 2026-06-11. The canonical peer location is `~/Workspace/4444J99/media-ark--<purpose>`, per the workspace's `~/Workspace/AGENTS.md` §\"Project Structure & Module Organization\" double-hyphen convention.",
  "No new worktrees at `~/Desktop/media-ark--*`. Pre-existing `~/Desktop/media-ark--*` worktrees are *legacy*; the conductor decides per-worktree whether to relocate, prune, or leave (the soul-persists rule: never destroy a worktree or branch without conductor authorization).",
  "The one exception: `worktree-new` explicitly names `~/Desktop/media-ark--<purpose>` as a cross-host peer *only* when the conductor has explicitly asked for the Desktop location in the session. The default is the workspace peer.",
  "Migration path: `git worktree move ~/Desktop/media-ark--<name> ~/Workspace/4444J99/media-ark--<name>` is a no-op for the branch but a relocation for the filesystem. The conductor runs the move; the agent may propose the move with the worktree name and last-touch date.",
]
